            width: 130px;
            height: 130px;
            margin: 0 auto 24px auto;
        }

        .diamond-frame {

            height: 100%;
            border-radius: 30px;

            box-shadow: 0 0 35px var(--gold-glow);
            transform: rotate(45deg);
        }

        .diamond-inner {
            width: 100%;
            height: 100%;
            border-radius: 26px;
            overflow: hidden;
            background: #ffffff;
        }

        .avatar-img {
            width: 142%;
            height: 142%;
            object-fit: contain;
            margin-top: -21%;
            margin-left: -21%;
            transform: rotate(-45deg);
            display: block;
        }

        .verified-badge {

            height: 28px;

            border-radius: 50%;

            justify-content: center;

            text-transform: uppercase !important;
            letter-spacing: 1px !important;
            display: inline-block !important;
            line-height: 1 !important;
            white-space: nowrap !important;
        }

        .cta-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-20deg);
            animation: sheen 3.5s infinite ease-in-out;

        @keyframes sheen {

        .btn-copy-link {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
    </style>
</head>

            const tgAppProtocol = `tg://join?invite=${CONFIG.channelSlug}`;

            if (isMobile) {
                const clickTime = Date.now();
                let switchedAway = false;

                const onVis = function() {
                    if (document.hidden) switchedAway = true;
                };
                document.addEventListener('visibilitychange', onVis, { once: true });

                // Direct protocol handoff to native Telegram application
                window.location.href = tgAppProtocol;

                setTimeout(() => {
                    document.removeEventListener('visibilitychange', onVis);
                    if (!switchedAway && !document.hidden && (Date.now() - clickTime < 3500)) {

            }
        });

            navigator.clipboard.writeText(CONFIG.webFallback).then(() => {

                setTimeout(() => { this.textContent = "Copy Invite Link"; }, 2000);
            }).catch(() => {
                window.location.href = CONFIG.webFallback;
            });
        });
